packages:\n  - apps/*\n  - ui-tui\n  - ui-tui/packages/*\n  - web\n  - tests-js\n\nengineStrict: true\n\n# The pnpm pin lives in pm/lock.json. The root preinstall and scripts/build/node-deps.mjs refuse\n# any other pnpm; root engines.pnpm (^12) makes pnpm <= 11 refuse even without scripts. A re-pin\n# to another pnpm major must move that range too (tests-js/pnpm-pin-guard.test.mjs fails until\n# it does). A pin pnpm recorded in pnpm-lock.yaml would prepend a second YAML document that\n# lockfile scanners (osv-scanner) do not read past.\npmOnFail: ignore\n\n# `pnpm run` never installs: installs belong to scripts/build/node-deps.mjs (and CI's explicit steps).\nverifyDepsBeforeRun: false\n\n# @electron/rebuild and the node-pty spawn-helper chmod modify installed packages in place; keep\n# those writes out of the shared, hardlinked store.\nsideEffectsCache: false\n\n# A dependency build script that is not reviewed below fails the install instead of being skipped.\nstrictDepBuilds: true\n\n# Minutes (14 days). Checked whenever the lockfile is resolved; user-machine installs trust the\n# already-checked lockfile (--trust-lockfile).\nminimumReleaseAge: 20160\n# Exemptions are exact `name@version` entries, one per line with the reason it cannot wait as an\n# inline comment (`- name@1.2.3  # why`). `nastech pm update --pnpm` drops an entry once the lockfile\n# no longer holds that version, so none needs a removal date. pnpm's own\n# minimumReleaseAgeExcludePrune stays off: it would run on every install and rewrite this tracked\n# file on users' machines.\nminimumReleaseAgeExclude:\n  # Exact equivalents of the prior reviewed npm release-age exceptions.\n  - '@assistant-ui/core@0.2.23'\n  - '@assistant-ui/react-streamdown@0.3.7'\n  - '@assistant-ui/react@0.14.29'\n  - '@assistant-ui/store@0.2.22'\n  - '@assistant-ui/tap@0.9.8'\n  - assistant-cloud@0.1.37\n  - assistant-stream@0.3.31\n  - '@radix-ui/number@1.1.3'\n  - '@radix-ui/primitive@1.1.7'\n  - '@radix-ui/react-accessibl