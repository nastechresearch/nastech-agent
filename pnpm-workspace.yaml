cy because pnpm >= 11.6 infers os: [win32] from the name of an\n  # optional one and skips it on macOS and Linux (pnpm/pnpm#17774). Its install script only fetches the\n  # win32 binding, falling back to a node-gyp build that fails where no prebuilt exists (win32-arm64,\n  # Linux without a compiler) and, for a regular dependency, fails the whole install.\n  # stage-native-deps.mjs runs that installer itself on win32 and degrades when it fails (dev runs:\n  # apps/desktop/scripts/dev-get-windows.mjs). Keyed by name: the denial holds for every version.\n  get-windows: false\n  lefthook@2.2.1: true\n