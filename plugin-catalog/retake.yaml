name: retake
title: Retake
repo: "https://github.com/wevial/retake"
sha: "fd0ae37d586f876cfe2b0297e363bfe0f23a8d3b"
maintainer: "wevial"
description: "Image-generation workspace for Nastech Desktop. Generate or upload an image, mark regions, request a reference-guided revision, compare versions and download. Disclosure — images, region notes and revision references you send are passed to your configured Nastech image provider, which may use credits or allowance; generated result links are downloaded from that provider; projects and image versions are stored in a local database in your Nastech profile."
tier: community
category: desktop
requires_nastech: ">=0.23.1"
version: "0.4.0"
platforms:
  - macos
  - linux
readme: true
screenshots:
  - "https://raw.githubusercontent.com/wevial/retake/fd0ae37d586f876cfe2b0297e363bfe0f23a8d3b/docs/images/1-project-overview.png"
  - "https://raw.githubusercontent.com/wevial/retake/fd0ae37d586f876cfe2b0297e363bfe0f23a8d3b/docs/images/2-mark-a-change.png"
  - "https://raw.githubusercontent.com/wevial/retake/fd0ae37d586f876cfe2b0297e363bfe0f23a8d3b/docs/images/3-compare-versions.png"
  - "https://raw.githubusercontent.com/wevial/retake/fd0ae37d586f876cfe2b0297e363bfe0f23a8d3b/docs/images/4-version-lineage.png"
known_issues:
  - "Still images only. Video generation is not included."
  - "Region notes are guidance, not masks: other parts of an image can change and pixel preservation is not guaranteed."
  - "Generation uses your Nastech image provider and may consume credits or allowance; cost and exact model can be unknown. A failed or lost call is shown as possibly billed and is never retried."
  - "Needs Nastech's mcp extra. If tool search hides image_generate, remove only that name from the profile's effective tools.tool_search.defer list (see the README); Retake never changes config for you."
  - "Optional model picker is hidden on stock Nastech v0.23.1; it appears only if Nastech exposes the image-selection listing."
  - "Screenshots are real Nastech Desktop captures with AI-generated demo art. Mac acceptance includes user-reported checks; Linux used a renderer harness plus one real revision, and native Linux input and upload acceptance is not claimed."
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
