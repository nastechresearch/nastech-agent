sha: "f5eddb64b2c976dfb520a8d83878db8589561bdc"
version: "0.3.0"
description: "Write, compile, sign and audit iOS Shortcuts from Nastech with no Mac: six tools turn plain-language intent into reviewable Cherri source, compile it to an unsigned .shortcut inside a bwrap sandbox, sign it through RoutineHub HubSign on explicit consent, and audit any .shortcut (signed AEA1 container or plain plist) for what it reads, writes and sends before it is installed. Bundles the shortcuts-authoring skill (file shape, verified action signatures, house patterns, and the traps that make a shortcut compile cleanly and still be broken). Disclosure — the Cherri compiler runs as a subprocess under bwrap with no network namespace, a read-only root, a throwaway HOME and only the job directory writable, and a build is refused rather than run on the host when bwrap is missing; talaria_setup, after Nastech approval, downloads the third-party Cherri v2.4.0 compiler (electrikmilk/cherri) from GitHub and installs it only if both recorded sha256 checksums match. Network call sites: talaria_status opens one TCP connection to the signing host only when called with probe_signer=true; talaria_inspect on an iCloud link fetches that shortcut from Apple's iCloud hosts only; talaria_sign uploads the compiled shortcut as an XML plist plus its name to https://hubsign.routinehub.services/sign (RoutineHub, a third party) only after Nastech approval per artifact, so unattended runs fail closed. Artifacts are written only under $NASTECH_HOME/talaria (or $TALARIA_HOME). No telemetry, no credentials."
maintainer: mjneuroart
tier: community
category: automation
