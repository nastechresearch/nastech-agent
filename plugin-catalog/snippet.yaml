description: "Connect a Snippet account to manage creator brand deals, sponsorship rates, brand emails, decisions and contract reviews through Snippet's hosted MCP server (Streamable HTTP at https://usesnippet.app/api/mcp, OAuth). Portable Agent Plugins v1 package (plugin.json + mcp.json), configuration only. The hosted server supplies its current tool list at runtime; tool availability can change independently of this catalog entry. Disclosure — every tool call goes to Snippet's hosted MCP server (https://usesnippet.app/api/mcp), which receives tool arguments and returns account data (deals, brand email threads, contract text); the tool set is served by that server at runtime and is not covered by the pinned sha; some tools write (send_reply sends brand email, answer_decision and draft_reply change account state) and the package declares trust: untrusted so Nastech asks before them and blocks them in unattended runs; a Snippet account is required and some actions need a paid plan; sign-in currently needs `nastech mcp add snippet --url https://usesnippet.app/api/mcp --auth oauth`, and that same-name native entry replaces the package's server entry including its trust setting, so add `trust: untrusted` under mcp_servers.snippet afterwards; Nastech stores and refreshes the OAuth tokens; the package ships no credentials, executables, dependencies, self-updater or telemetry."
maintainer: aaupadhy
