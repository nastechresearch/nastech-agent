description: "Read-only dashboard tab and model-free /duty and nastech duty summaries for waiting conversations, unanswered messages, running turns, undelivered background results and failing cron jobs. Supports all 17 dashboard languages, including right-to-left Arabic. Disclosure — opens NASTECH_HOME/state.db with SQLite mode=ro (sessions, messages, turn leases, async delegations, goals) and reads cron/jobs.json and gateway_state.json; writes only NASTECH_HOME/duty-board/dismissed.json for dashboard dismissals. Chat requires in-process Nastech 0.21.7+ and a configured owner; shared-chat summaries default to counts only. No network calls, no model calls, no credentials, no background processes."
