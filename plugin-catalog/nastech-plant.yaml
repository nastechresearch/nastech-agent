version: "1.2.0"
title: Nastech Plant
description: "A calm little garden for Nastech Desktop that grows in real time. It sits above the app like the Nastech pet, takes no layout space and can be dragged anywhere. Click a plant for a care wheel: water, prune (you choose which tip to cut, and the piece drops away), rotate, fertilize, repot, pick, sell, or ask Nastech. Four species (leafy plant, fern, cactus, little tree) grow in their own ways, pruning shapes how each one branches, and neglect only pauses them. Care earns play coins, and a small shop sells more plants and fertilizer, up to six pots. Bugs land now and then and can be shooed away. Two agent tools let Nastech check the garden and tend it when you ask. Original blue-ink artwork drawn in code. Reachable from the status bar, the command palette and the keyboard, and it speaks through the Nastech pet when one is showing. Disclosure: no network requests, no background model calls and no background processes; Ask Nastech submits one chat message only when you press it; coins are play money inside the plugin; the garden is kept in Desktop plugin storage and in plugin-data/nastech-plant/data.db; the plugin adds its own floating element to the page (Nastech has no SDK area for one) and removes it on unload, without reading or changing core markup."
