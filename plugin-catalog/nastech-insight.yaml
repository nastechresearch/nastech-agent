description: Selection-definition lookup for Nastech Desktop. Select any text, get an AI definition with sources in a popup. Renders the definition inline, runnable code aside. Backend is a stateless nastech insight CLI; panel, providers, and one-click model picking are configurable. Disclosure — definitions are generated with your configured provider keys (the selected term, your format template and optional web-search results are sent to that provider) via a short-lived `nastech insight` CLI run; no background process remains. When web search is on it also queries your configured searxng instance and fetches result thumbnails from their image hosts, inlining them into the panel; nothing is fetched without a searxng URL.
