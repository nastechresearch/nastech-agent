docs_url: https://github.com/hydra-db/hydradb-nastech-plugin#readme
readme: true
platforms: [linux, macos, windows]
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - HYDRADB_API_KEY
    - HYDRADB_DATABASE


