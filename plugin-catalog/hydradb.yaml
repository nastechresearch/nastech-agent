description: "HydraDB long-term memory for Nastech: prompt-time recall (prefetch) and non-blocking turn capture (sync_turn). Disclosure — when selected as the memory provider, each turn's user message (as the recall query) and every completed user/assistant turn are sent over HTTPS to the HydraDB API (api.hydradb.com, or HYDRADB_BASE_URL) under HYDRADB_API_KEY."
maintainer: hydra-db
tier: community
category: memory
requires_nastech: ">=0.21.5"
