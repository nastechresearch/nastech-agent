name: polyglot
repo: https://github.com/Subramanyarao11/hermes-polyglot
sha: fbe2fc02e8e61648642887cb0d11d7012ae59b1d
description: "Live interpreter for group chats on the Nastech gateway (Telegram, Discord): an authorized user sends /polyglot on in a group, and every message from a sender Nastech admits is then translated into each other member's reading language, returned as the reply. Languages are learned from each person's first message or set with /lang; \"nastech, ...\" or an @mention still reaches Nastech as a normal question. Translates with the user's own Nastech model; a Sarvam AI key is optional for Indian languages. Disclosure — registers one hook (post_gateway_admission, so it runs only after Nastech's authorization) and two commands (/polyglot, /lang), no tools; in chats where an authorized user ran /polyglot on, message text from admitted members goes to the configured model provider through Nastech's ctx.llm, and, only if SARVAM_API_KEY is set, text for Indian languages goes to https://api.sarvam.ai; translations are posted back to the group as the bot's reply, and ordinary group messages in those chats no longer start an agent turn; stores each group's member languages and display names in Nastech's plugin state; no file reads, shell commands, background processes or telemetry."
maintainer: Subramanyarao11
tier: community
category: platform
requires_nastech: ">=0.23.0"
