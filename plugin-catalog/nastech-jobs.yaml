description: "Google Calendar is the one supported backend today (scope calendar.events, one bound calendar). Bidirectional sync between Nastech cron (system of record) and that job board. discover/status are read-only; sync plans both directions and is dry-run unless --confirm on the CLI. Read-only /jobs slash command shows the 7-day agenda and pending changes; each job's last run time and status (ok/error) is written to its event as a colour and one description line, never the title. Disclosure — syncs Nastech cron job names, next-run times and last-run status (never prompts; only a prompt sha256) to one Google Calendar you bind, over Nastech plugin OAuth (`nastech auth add nastech-jobs:google`, scope calendar.events, host www.googleapis.com). Reads `~/.nastech/cron/jobs.json` read-only, and the first 8 KB of each no-agent cron job's script under `~/.nastech/scripts/` only to recognise its own auto-sync job. Calendar edits change a cron job's schedule or name only when you run `nastech nastech-jobs sync --confirm`. The opt-in experimental skip writes `~/.nastech/scripts/nastech-jobs-skip-tick.py` and creates two one-shot no-agent cron jobs. The opt-in `mcp-serve` push mode polls Calendar every 60 s and POSTs signed event ids to your own gateway webhook URL."
