description: 'Bubblewrap terminal backend for Linux: every terminal and execute_code command runs in its own bwrap
  sandbox on this machine at the host''s own paths, with a read-only root, a writable working directory (per
  profile: restricted, workspace or network), the dot entries of the home directory (credential stores always) and
  the Nastech home hidden, private temp and process directories, agent and docker sockets masked, and per-command
  memory, CPU and process limits (`nastech config set terminal.backend bubblewrap`). Disclosure — no Python dependencies and no network calls of its
  own: it runs your commands through the `bwrap` and `prlimit` binaries you install (bubblewrap, util-linux), and
  under the default `network` profile those commands share the host network. It reads no credentials. File tools
  (read_file, write_file, patch, search_files) run inside the sandbox too, and because the working directory is a
  real host directory Nastech keeps its dangerous-command prompts, as for the local backend.'
