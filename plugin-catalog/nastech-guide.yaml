name: nastech-guide
repo: https://github.com/iap/hermes-guide
sha: 5a3d45d8f122d0e246d7009b7dc4f00d2e7fe07b
description: "Read-only diagnostics for Nastech configuration: /nastech-doctor in-session and nastech guide in a terminal. Nine read-only health checks (config, mcp, skills, commands, hooks, plugins, memories, sessions, update) and points to 22 troubleshooting skills, installed separately as a skills tap, for what the built-in doctor doesn't cover. Complements — never replaces — nastech doctor. Disclosure — reads config.yaml, SKILL.md frontmatter, skill bundles, plugin manifests, the shell-hooks allowlist and the built-in MEMORY.md/USER.md stores read-only (the report quotes short memory snippets); the sessions scope reads the tail of logs/agent.log read-only for runaway-session signatures (session ids, model names and token counts appear in the report); the update scope reads the update-lock record in the co-located nastech-agent checkout under $NASTECH_HOME and probes it — owner-PID liveness, then a brief lock acquisition it releases immediately, opening the lock file writable, with a read-only fallback for a root-owned lock on POSIX (writes no content, never deletes the lock); registers one read-only plugin skill, nastech-guide:start, listed in model sessions while the plugin is enabled; /nastech-doctor and nastech guide run nastech config path as a subprocess (argument list, no shell); the default hooks check reads hook configuration, consent state and the exec bit in-process and executes nothing, while hooks --deep runs nastech hooks doctor, which executes every approved shell hook once with a synthetic payload (--fast starts no subprocess and executes no hook); /nastech-doctor and nastech guide (except with --fast or --json) also run git ls-remote once per process against the plugin's GitHub repo to print a newer-release notice (no download, no local writes); with opt-in proactive: true it runs the checks (including the agent.log scan and the update-lock probe) in-process at each session start/end (no hooks executed, no subprocesses, no network). The 22 troubleshooting skills are not loaded by the plugin: they install separately from the repo as a skills tap, which this entry's pin does not cover."
maintainer: iap
tier: community
category: tools
requires_nastech: ">=0.21.0"
version: "0.8.11"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
    - on_session_start (opt-in proactive mode)
    - on_session_end (opt-in proactive mode)
  provides_middleware: []
  requires_env: []
