title: Tune-up
description: "Keep Nastech fast, healthy and tidy from one Desktop panel. Clean up sorts the Nastech home into Safe to clean, Take a quick look and Kept safe on purpose, with plain-language answers to what is it, is it safe and can I undo; it reviews exact items before anything happens and reports the measured space recovered. It runs the maintenance Nastech ships but few people find (sessions prune with preview, pm gc, uv cache prune, checkpoints, worktree prune, session-database packing), finds folders Nastech created elsewhere from its own session history, and moves reviewable items to a restorable 30-day Trash. Checkup explains down or crash-looping Nastech services and stops leftover agent processes; Explore shows a size map with folder descriptions and duplicate finding; optional consented AI explanation via its own auxiliary task. Disclosure — Linux (systemd) and macOS (launchd); no network except an optional, consented AI explanation (folder totals and counts only) through Nastech's routing; reads home metadata, tool caches, session history, /proc process and open-file info, systemd unit settings, journal lines, crontab and git ls-files; on macOS instead the process table via psutil, Nastech's own processes.json and spawn ledger, Nastech LaunchAgent plists (label, program, KeepAlive, log path, NASTECH_HOME/HOME only), the settings of every LaunchAgent and LaunchDaemon plist in ~/Library/LaunchAgents, /Library/LaunchAgents and /Library/LaunchDaemons without their environment entries (to see whether a job starts something from a project folder, kept local), launchctl print/list/print-disabled (state, PID, run count, last exit code only) and the last lines of a service's error log inside <Nastech home>/logs (never .env, auth.json, env files, start scripts, any other process's environment or other launchd environment entries); on user confirmation it permanently deletes chosen files in Nastech-created project folders and ~/.cache, ~/.npm and ~/.pnpm-store tool caches, moves other items to a restorable 30-day Trash, runs allow-listed nastech/uv/pnpm/git maintenance plus journalctl --vacuum-size and apt-get clean when root, starts/restarts/stops/disables Nastech systemd services or (macOS) starts/restarts Nastech LaunchAgents and boots out + disables a crash-looping one (plist kept), can write a Restart=always drop-in (Linux) and enable the disk-cleanup plugin, sends SIGTERM (then SIGKILL if it does not exit) to selected leftover processes, and briefly stops Nastech services to pack state.db (Linux; on macOS it shows the manual steps instead); non-Nastech child processes get only PATH, HOME and locale."
