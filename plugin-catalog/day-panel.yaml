name: day-panel
title: Today (day panel)
repo: https://github.com/brunosouzas/nastech-day-panel
sha: 2a971fec47d16829b73c95fe053eac6f12389903
description: "A Today page in Nastech Desktop, plus nastech day show and check, built from sections you list in a YAML file: any program that prints JSON (your tracker, a script of yours), your open GitHub pull requests and review requests through gh, one read-only tool of an MCP server you already configured, and your AI providers' limit windows from nastech usage. Items can carry a colour, a progress bar and a relative time; the page follows the Desktop theme. Ships a demo page that needs no login or network. Read-only and no model calls; merging a pull request from the page is off by default and needs a preview and a confirmation pinned to the head commit. Disclosure — runs the programs your sources file names (no shell), plus gh and nastech usage, as your user with your existing logins; calls a configured MCP server's tool only when the server marks it readOnlyHint, in a child process that imports three undocumented Nastech MCP modules (there is no public seam for this yet); reads only the sources file; writes nothing to disk; logs carry section names and exit statuses, not source output. No credentials stored, no telemetry."
maintainer: brunosouzas
tier: community
category: desktop
requires_nastech: ">=0.22.2"
docs_url: https://github.com/brunosouzas/nastech-day-panel#readme
version: "0.1.0"
readme: true
screenshots:
  - https://raw.githubusercontent.com/brunosouzas/nastech-day-panel/2a971fec47d16829b73c95fe053eac6f12389903/docs/today.png
platforms: [macos, linux]
known_issues:
  - "The mcp_tool source imports undocumented Nastech MCP internals (discover_mcp_tools, _tool_is_read_only, mcp_prefixed_tool_name); a Nastech release can break that one source until the plugin is updated. The other sources do not use them."
  - "Under plugins.isolation: host the nastech day terminal command is not available (Nastech skips plugin CLI commands in the host); the Desktop page still works."
  - "The Desktop half ships disabled, like every plugin's: turn it on in Capabilities → Plugins."
capabilities:
