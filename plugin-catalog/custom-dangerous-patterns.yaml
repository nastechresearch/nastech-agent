description: >-
  Add custom dangerous command patterns to Nastech's built-in approval
  system. Users define regex patterns in YAML; a pre_tool_call hook sends
  block patterns to Nastech's human approval gate and blocks deny patterns
  immediately. Modifies no Nastech internals.
