name: lowrouter
repo: https://github.com/carboniferio/nastech-lowrouter-provider
sha: 5531e83c0c13224c5501ccab09f11724b193d7fd
subdir: lowrouter
description: >-
  LowRouter as a Nastech model provider (`--provider lowrouter`, or LowRouter in `nastech model`).
  The picker shows the 180 `auto/` chat models with tool calling and 64K+ context, plus the
  user's own `alias/` models, instead of all 719 IDs from /v1/models. Context windows come from
  LowRouter's catalog instead of Nastech' 256K fallback, and /usage shows the credit balance in
  euros. LowRouter bills in EUR, so the plugin reports no USD cost and Nastech shows it as unknown.
  Maintained by LowRouter. Disclosure — registers one model provider and nothing else (no tools,
  hooks, commands or threads). Prompts, tool schemas and LOWROUTER_API_KEY go to
  https://api.lowrouter.ai/v1 (or the configured model.base_url) through Nastech' client, and
  LowRouter forwards each request to the host serving the model. The plugin's own requests are
  GET /v1/models (cached for an hour) and GET /v1/credits on /usage, to the same base URL with the
  same key, through Nastech' open_credentialed_url. No files read or written, no processes.
maintainer: carboniferio
tier: community
category: models
requires_nastech: ">=0.21.5"
docs_url: https://github.com/carboniferio/nastech-lowrouter-provider#readme
version: "0.1.0"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - LOWROUTER_API_KEY
