description: AnyRouter — one API key for many models through an OpenAI-compatible gateway. The /model picker lists only tool-capable routes, and meta-models like anyrouter/nastech auto-route across top models with fallback. Disclosure — sends your prompts and ANYROUTER_API_KEY to anyrouter.dev, a third-party relay that forwards to upstream vendors (OpenAI, Anthropic, Google, xAI, …), on some plans through a shared pool of other members' donated free-tier vendor keys; billed in prepaid AnyRouter credits. anyrouter/nastech is AnyRouter's own routing meta-model, not a Nastech Research model. Opt-in ANYROUTER_APP_ATTRIBUTION=1 adds Nastech attribution headers.
maintainer: AnyRouterHQ
tier: community
category: models
docs_url: https://github.com/AnyRouterHQ/hermes-provider-anyrouter#readme
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - ANYROUTER_API_KEY
