description: 'Singularity/Apptainer terminal backend: Nastech''s terminal, file and code tools run inside a
  hardened, rootless container on this machine (--containall --no-home), with CPU/memory limits and an
  optional per-session persistent overlay (`nastech config set terminal.backend singularity`; image from
  `terminal.singularity_image`). Formerly built into Nastech core; existing users are migrated automatically.
  Disclosure — no Python dependencies and no network calls of its own: it drives the `apptainer` (or
  `singularity`) CLI you install, which pulls the configured image (default
  `docker://nastechresearch/nastech-sandbox:desktop`) and caches a SIF under your scratch directory. Your skills
  and registered credential files are bind-mounted read-only into the container, and because the container
  is a disposable sandbox Nastech skips its dangerous-command prompts there, as for its other container backends.'
