name: loreconvo
repo: https://github.com/labyrinth-analytics/loreconvo
sha: 4c8e3ace627b7f7d46e29a5c1808c6c45081f8e5
subdir: integrations/nastech
description: "LoreConvo memory provider: cross-surface persistent session memory with search, recall and structured memory items. Disclosure — stores end-of-session transcripts (truncated, including tool output) and Nastech memory writes in ~/.loreconvo/sessions.db, a store shared across all Nastech profiles and other LoreConvo clients, and injects context from those sessions into each turn; a Pro license enables a one-time Hugging Face embedding-model download; installs the loreconvo package (BUSL-1.1) with lancedb, fastembed and onnxruntime into the Nastech environment."
tier: community
category: memory
maintainer: labyrinth-analytics
capabilities:
  provides_tools:
    - loreconvo_search_sessions
    - loreconvo_get_context
    - loreconvo_save_memory
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - LORECONVO_NASTECH_PROJECT
requires_nastech: ">=0.21"
version: "0.10.15"
docs_url: https://github.com/labyrinth-analytics/loreconvo?tab=readme-ov-file#loreconvo
