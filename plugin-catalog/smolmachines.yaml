requires_nastech: ">=0.21.6"
docs_url: https://github.com/smol-machines/hermes-smolmachines#readme
platforms: [linux, macos]
known_issues:
  - "The engine stops a command once it has printed 11 MiB. Nastech gets the output up to that point, marked OUTPUT TRUNCATED. Send large output to a file in the machine."
  - "The plugin imports tools.environments.base.FileFetchError (in Nastech since 0.21.6), the error fetch_file is documented to raise. It is outside the documented-name allowlist, so a Nastech release that moves it can break file delivery until the plugin is updated."
