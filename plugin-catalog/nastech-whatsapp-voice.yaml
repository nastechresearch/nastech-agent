name: nastech-whatsapp-voice
repo: https://github.com/ashwanthbalakrishnan5/hermes-whatsapp-voice
sha: 562572e4927f8c5216df414c786c30d0066a8054
title: WhatsApp Voice Calls
description: >-
  Live voice calls with Nastech over WhatsApp, on the linked-device (personal number) setup most
  Nastech users already have, with no WhatsApp Business account. Call your bot's number and talk to
  your Nastech: the voice uses Nastech's own persona (a short briefing fetched from Nastech) and hands
  real work to Nastech mid-call. Or let Nastech call you for things that matter: whatsapp_call_owner
  rings only the configured owner number (it has no destination parameter) and reports answered,
  no answer or declined, so the agent can fall back to another channel, including from cron. A short
  summary of each call arrives in WhatsApp, and each call keeps a record with timing metrics
  (nastech whatsapp-voice calls). Speech runs on Gemini Live (gemini-3.8-live by default), reusing the
  Gemini key Nastech already has; every call setting (languages, pauses, timeouts, any Live setup
  field) is configurable. Optional chat-session mode (context_mode: core_session, off by default)
  makes the call part of the owner's WhatsApp chat with Nastech. Setup is a dashboard tab (pairing QR,
  settings, test call) or an agent runbook skill.
  Disclosure — runs a separate sidecar process (Rust, built on whatsapp-rust) that the user starts or
  installs as a systemd/launchd user service; the binary is downloaded from this repo's GitHub
  release, built and attested by its release workflow, and checked against checksums pinned in the
  repo (plus the build attestation when the gh CLI is present). The sidecar becomes an extra linked
  device of the bot's WhatsApp number through an unofficial protocol, stores that session in the
  plugin's data directory, and answers only the owner's number. During calls it streams audio to
  generativelanguage.googleapis.com with GOOGLE_API_KEY or GEMINI_API_KEY (read via get_secret), along
  with the persona briefing, the outgoing call's reason and ask_nastech results as text. It calls the
  local api_server with API_SERVER_KEY for ask_nastech (a full Nastech turn with the owner's tools), the
  persona briefing (at startup and after each call) and the post-call summary, a run that may write
  to Nastech memory and whose result is sent to the owner on WhatsApp. The
  dashboard tab's backend saves only this plugin's settings (through nastech config set), starts and
  stops pairing, places test calls to the owner, and restarts the sidecar service (systemctl --user
  or launchctl). A pre_gateway_dispatch hook sends the owner's WhatsApp DM texts into an active
  chat-session call instead of a second text reply (slash commands, media, groups and other chats are
  untouched). Chat-session mode (opt-in) also runs a loopback service inside Nastech's process that
  reads the owner's WhatsApp DM session (system prompt, recent history, tool schemas) and sends it to
  Gemini, runs only the tools listed in voice_tools through Nastech in that session, and writes the
  call into that session. It never answers Nastech approval prompts: a command that needs approval is
  denied during the call and the owner is told to ask again in the WhatsApp text chat; it imports private Nastech modules (listed in the repo's
  CORE_PATCHES.md) and falls back to the default mode if they change. Optional recording
  (record_calls, off) saves the owner's side of each call as WAV in the plugin's data directory,
  locally only. An advanced voice_api_url setting can point the Live connection at another endpoint,
  which then receives the Gemini key and call audio. No telemetry.
maintainer: ashwanthbalakrishnan5
tier: community
version: "0.2.2"
category: voice
docs_url: https://github.com/ashwanthbalakrishnan5/hermes-whatsapp-voice#readme
requires_nastech: ">=0.21.6"
platforms: [linux, macos]
known_issues:
  - "Uses an unofficial, reverse-engineered WhatsApp protocol (whatsapp-rust): WhatsApp updates can break calls, and automated use may get the bot number restricted. Use a number you can afford to lose."
  - "Prebuilt sidecar binaries cover Linux amd64/arm64 and macOS arm64; elsewhere it builds from source (Rust 1.94+, cmake, a C compiler)."
capabilities:
  provides_tools:
    - whatsapp_call_owner
    - whatsapp_call_status
  provides_hooks:
    - pre_gateway_dispatch
  provides_middleware: []
  requires_env: []
