description: The Nastech desktop app in your browser. `nastech workbench` serves the desktop interface through the Nastech dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Nastech product. On the first `nastech workbench` run and again after each Nastech update it runs `npm install --ignore-scripts` (guided by Nastech's lockfile) and Vite against your Nastech checkout's desktop sources, writing only under ~/.nastech/nastech-workbench and its own plugin dir (the checkout is only read), and starts `nastech dashboard` on loopback when none is running.
maintainer: sxuff
