description: "Nastech Plugin Dev: build Nastech plugins with Nastech. A plugin-development skill plus two offline tools that scaffold a new plugin and lint it against the catalog rules before you submit. The nastech-plugin-dev:nastech-plugin-development skill covers manifest v2 and strict YAML, the ctx API, all 46 hooks, capabilities and isolation, dashboard and Desktop panes, testing, release and catalog submission, and lessons from catalog reviews, with a template plugin and catalog-entry and PR-body templates. hpd_scaffold(target_dir, name) copies the hello-nastech template, which passes nastech plugins validate and doctor --ci as-is, renames it, and adds a catalog entry and PR body stub; it refuses non-empty folders and never overwrites. hpd_check(path, catalog_entry?) is a read-only lint: strict YAML, manifest rules, provides_tools against the registered tools, a security preflight, static schema token cost, and catalog entry rules (sha, image hosts, category, subdir, at most 6 screenshots). Both tool schemas together cost 190 o200k tokens. It is for anyone writing a first Nastech plugin or getting one ready for a catalog PR. To start, run nastech plugins install nastech-plugin-dev and nastech plugins enable nastech-plugin-dev, then ask: \"Scaffold a Nastech plugin called weather-now in ~/code/weather-now, then check it.\" Finish with nastech plugins doctor <dir> --ci and nastech plugins validate <dir> --install-deps. The same skill installs into other coding agents with npx skills add mojomast/hermes-plugin-dev. Disclosure — `hpd_scaffold` creates files in any new or empty folder the model names (fixed template content only); `hpd_check` reads any folder or file the model names (read-only, never imports it); the user-run `nastech hpd check <dir> --execute` imports and runs the target plugin's `register()` unsandboxed in the Nastech process, so use it only on code you trust."
