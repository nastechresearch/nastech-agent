name: lethe
title: Lethe
repo: https://github.com/itsflownium/hermes-lethe
sha: 8b93e2dce9402648c7e238c1d8c83dc649f2f204
description: "Take one chat off the record with /lethe: nothing reaches memory, your profile or skills, the transcript is deleted, and a river shows every write it kept out.\n\nUse an external memory provider? Copy this into a Nastech chat and replace <PROVIDER> with yours:\n\nExtend my local Lethe plugin (~/.nastech/plugins/lethe) so off-the-record chats also skip my <PROVIDER> memory provider's per-turn sync, session-end extraction and save tools when store.is_on(session_id) is true. Show me the diff, add a test, then run nastech gateway restart. Disclosure — Deletes the off-the-record chat's transcript (and its compression chain) from Nastech's session database via SessionDB.delete_session when the chat ends, on /lethe-end or /lethe-forget, or from the Desktop panel's Delete transcript now (unless keep_transcript is on); while on, it blocks memory, user-profile and skill writes plus provider tools whose names look like saves, and adds a fixed off-the-record note to each turn's context; external memory providers' per-turn sync is not blocked."
maintainer: itsflownium
tier: community
category: memory
requires_nastech: ">=0.23.1"
docs_url: https://github.com/itsflownium/hermes-lethe#readme
version: "0.1.0"
image: https://raw.githubusercontent.com/itsflownium/hermes-lethe/8b93e2dce9402648c7e238c1d8c83dc649f2f204/assets/banner.png
screenshots:
  - https://raw.githubusercontent.com/itsflownium/hermes-lethe/8b93e2dce9402648c7e238c1d8c83dc649f2f204/assets/review/panel-light.png
  - https://raw.githubusercontent.com/itsflownium/hermes-lethe/8b93e2dce9402648c7e238c1d8c83dc649f2f204/assets/review/panel-dark.png
readme: true
platforms: [linux, macos]
known_issues:
  - "External memory providers (memory.provider) are not covered out of the box. Ask Nastech: \"Extend my local Lethe plugin (~/.nastech/plugins/lethe) so off-the-record chats also skip my <PROVIDER> memory provider's per-turn sync, session-end extraction and save tools when store.is_on(session_id) is true. Show me the diff, add a test, then run nastech gateway restart.\""
  - The end-of-chat receipt can't print at /exit in the CLI/TUI yet (the shared gateway drops plugin end-of-session messages); use /lethe-end first. The transcript is deleted either way.
  - In a brand-new Desktop chat, typing /lethe first hits Nastech's "Submission destination changed" error; use the panel's Start off the record.
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_tool_call
    - pre_llm_call
    - post_llm_call
    - on_session_finalize
    - on_session_start
  provides_middleware: []
  requires_env: []
