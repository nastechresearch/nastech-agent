name: Nastech Release

# This workflow is intentionally manual-only. It never runs for a push, pull
# request, tag, schedule, or release event.
#
# It is a thin, protected wrapper over the stable release pipeline
# (`scripts/releases/`, see website/docs/developer-guide/stable-releases.md):
#
#   PREVIEW  -> `release.py changelog` prints the notes the next draft would
#               carry. It claims nothing, tags nothing and needs no secrets.
#   PUBLISH  -> `release.py release` claims the next attempt, cuts the draft
#               release, and dispatches `Stable Release` (the gate). The
#               protected `release-publish` environment approves the claim
#               before the tag is pushed.
#
# The `Stable Release` gate publishes, not this workflow. Publishing the draft
# from the GitHub UI by hand skips the vX.Y.Z receipt tag, the update feeds,
# the Docker aliases and the Store check, and leaves the attempt permanently
# outstanding — never do it.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semantic version component to bump"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      action:
        description: "PREVIEW prints the notes only; PUBLISH claims an attempt and starts the Stable Release gate"
        required: true
        default: PREVIEW
        type: choice
        options:
          - PREVIEW
          - PUBLISH
      autopublish:
        description: "PUBLISH only: publish as soon as the gate is green (off leaves a draft until a later green claim resolves it)"
        required: false
        default: true
        type: boolean
      no_changelog:
        description: "PUBLISH only: claim with an empty commit list. Use when the auto-generated body exceeds GitHub's 125000-character limit; paste curated notes into the draft afterwards"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nastech-manual-release
  cancel-in-progress: false

jobs:
  preview:
    name: Preview Nastech release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2
        with:
          # The changelog walks commits and the tag math reads the full tag list.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Generate release preview
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/release.py changelog \
            --commit "$(git rev-parse origin/main)" \
            --bump "$BUMP" \
            --remote origin | tee release-preview.md
          cat release-preview.md >> "$GITHUB_STEP_SUMMARY"

      - name: Explain publish boundary
        run: |
          if [ "${{ inputs.action }}" = "PUBLISH" ]; then
            echo "Publish was requested; the protected publish job claims the attempt and starts the Stable Release gate." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Preview complete. No attempt ref, tag, draft, or workflow dispatch was created." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload release preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nastech-release-preview
          path: release-preview.md
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish approved Nastech release
    needs: preview
    if: github.ref == 'refs/heads/main' && inputs.action == 'PUBLISH'
    runs-on: ubuntu-latest
    environment: release-publish
    permissions:
      contents: write # Claim the attempt ref and create the draft release
      actions: write # release.py dispatches the Stable Release gate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2
        with:
          # The tag math reads the full tag list; the claim walks commits.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Configure release committer
        run: |
          git config user.name "nastechresearch[bot]"
          git config user.email "nastechresearch[bot]@users.noreply.github.com"

      - name: Claim the attempt and start the gate
        env:
          BUMP: ${{ inputs.bump }}
          AUTOPUBLISH: ${{ inputs.autopublish }}
          NO_CHANGELOG: ${{ inputs.no_changelog }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(release --commit "$(git rev-parse origin/main)" --bump "$BUMP" --remote origin)
          if [ "$AUTOPUBLISH" = "true" ]; then
            args+=(--autopublish)
          fi
          if [ "$NO_CHANGELOG" = "true" ]; then
            args+=(--no-changelog)
          fi
          python3 scripts/release.py "${args[@]}"
