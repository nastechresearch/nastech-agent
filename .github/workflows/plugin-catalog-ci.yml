name: Plugin Catalog CI

# Admission gate for plugin-catalog entries. Fires ONLY on PRs touching
# plugin-catalog/** so it can never go red on unrelated PRs.
#
# Two gates:
#   structural            — cheap schema check, no nastech install needed
#   pinned-source-validate — supply-chain gate: the pinned sha MUST be
#                            reachable in the entry's repo, and the plugin
#                            at that exact commit must pass
#                            `nastech plugins validate`.

on:
  pull_request:
    paths:
      - "plugin-catalog/**"

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false # this job is read-only

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install ruamel.yaml
        uses: ./.github/actions/retry
        with:
          command: pip install ruamel.yaml==0.18.17

      - name: Validate catalog files (structural)
        run: |
          set -euo pipefail
          # Validating the whole directory is simpler than diffing and keeps
          # the invariant that EVERYTHING in plugin-catalog/ stays valid.
          python3 scripts/validate_plugin_catalog.py plugin-catalog/

  pinned-source-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          # Full commit graph + tags, blobs on demand: the diff below needs the
          # merge commit's first parent, and Nastech resolves its own version
          # from the release tags merged into HEAD. A shallow checkout reports
          # "unknown", which plugins checking the host version reject (omh).
          fetch-depth: 0
          filter: blob:none
          # `nastech plugins validate` below runs pinned-repo code; keep the
          # job's token out of .git/config where that code could read it.
          persist-credentials: false

      - name: Find changed catalog entries
        id: changed
        run: |
          set -euo pipefail
          # The engine's update replays the whole branded upstream tree to
          # the reserved 100WAYS branch, so a sync PR touches every path and
          # can never satisfy the data-only rule below. It is the engine's
          # own push, not a plugin admission: skip the gate for it.
          if [ "${GITHUB_HEAD_REF:-}" = "100WAYS" ] \
            && [ "${{ github.event.pull_request.head.repo.full_name }}" = "nastechresearch/nastech-agent" ]; then
            echo "Fork 100WAYS sync PR: catalog admission gate does not apply."
            {
              echo 'files<<__EOF__'
              echo '__EOF__'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD is the PR merge commit: diffing it against its first parent is
          # exactly what the PR would land. Refuse anything else rather than
          # silently diffing a single commit.
          if ! git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            echo "::error::expected the pull_request merge commit as HEAD"
            exit 1
          fi
          python3 -I "$GITHUB_WORKSPACE/scripts/ci/catalog_changed_entries.py"

      - name: Prepare Nastech from the PR's own checkout
        if: steps.changed.outputs.files != ''
        uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          extras: '[]'

      - name: Clone each entry at its pinned sha and validate
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          # A hostile repo URL must never block the job on a credential prompt.
          GIT_TERMINAL_PROMPT: "0"
          # `gh attestation verify` (README rule 17) reads the attestation from
          # GitHub and needs a token. Read-only default token; the step runs
          # pinned-repo code, so nothing broader is exposed here.
          GH_TOKEN: ${{ github.token }}
        run: python3 -I "$GITHUB_WORKSPACE/scripts/ci/catalog_validate_pinned_entries.py"
