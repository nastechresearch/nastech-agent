name: Release

# The unattended front door for `scripts/release.py release`. It takes the bump
# a human would type and runs the same command, so the claim is minted by the one
# implementation that knows its shape.
#
# Why this exists: cutting a stable release means an annotated attempt ref
# `rc.<N>-vX.Y.Z` whose *message* is the JSON claim record that
# `scripts/releases/stable.py::_claim_metadata` validates -- schema, version,
# attempt, commit, autopublish, lanes, lanesRevision and a `claimEpoch` that must
# equal the tag object's own tagger timestamp. Minting that by hand in a workflow
# produced a tag whose message was prose, and `Admit the claim` died with
# `Stable claim metadata is invalid`. `entrypoint.release()` writes the record and
# pins the tagger date to the epoch it declares, which is the only way the two
# can agree.
#
# The version is derived, never typed: `published_stable_identity()` reads the
# published head (the seed, 0.21.5, until the first stable ships) and `--bump`
# moves it. So `bump=minor` on the seed is v0.22.0.
#
# The desktop lanes are unsigned by construction: every caller of
# desktop-bundled-release passes `skip-signed: true`, so there is nothing to
# toggle here until Apple/Azure signing is configured at those call sites.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'SemVer level the next version takes from the published head (seed 0.21.5: minor = 0.22.0)'
        required: true
        type: choice
        options: [patch, minor, major]
        default: minor
      commit:
        description: 'Commit to claim. Empty is main as this workflow runs.'
        required: false
        type: string
        default: ''
      autopublish:
        description: 'Record the claim as autopublish: publication follows a green gate without a second dispatch'
        required: false
        type: boolean
        default: false
      with-lanes:
        description: 'Comma-separated lanes to add to the default set (see scripts/releases/lanes.py)'
        required: false
        type: string
        default: ''
      without-lanes:
        description: 'Comma-separated lanes to drop from the default set'
        required: false
        type: string
        default: ''
      no-changelog:
        description: 'Leave the commit list out of the draft body (the generated notes can outgrow GitHub release bodies)'
        required: false
        type: boolean
        default: false
      abandon-version:
        description: 'Version whose outstanding attempts to clear (cancel runs, delete drafts, mark abandoned) before cutting. Empty refuses instead.'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: stable-release-cut
  cancel-in-progress: false

jobs:
  cut:
    name: Claim the attempt and start the gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: ./.github/actions/setup-pm
        with:
          cache-python: false

      - name: Release line identity
        run: |
          set -euo pipefail
          # An annotated tag needs a committer; a runner has none, and git fails
          # with `fatal: empty ident name ... not allowed`. Fixed, so the claim's
          # tagger never depends on who pressed the button.
          git config user.name "nastech-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Clear the outstanding attempts
        if: inputs.abandon-version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ABANDON_VERSION: ${{ inputs.abandon-version }}
        run: python scripts/release.py abandon --version "$ABANDON_VERSION"

      - name: Cut the claim
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          COMMIT: ${{ inputs.commit }}
          AUTO_PUBLISH: ${{ inputs.autopublish }}
          NO_CHANGELOG: ${{ inputs['no-changelog'] }}
          WITH_LANES: ${{ inputs.with-lanes }}
          WITHOUT_LANES: ${{ inputs.without-lanes }}
        run: |
          set -euo pipefail
          args=(--bump "$BUMP" --commit "${COMMIT:-refs/remotes/origin/main}")
          if [ -n "$WITH_LANES" ]; then
            args+=(--with "$WITH_LANES")
          fi
          if [ -n "$WITHOUT_LANES" ]; then
            args+=(--without "$WITHOUT_LANES")
          fi
          if [ "$AUTO_PUBLISH" = 'true' ]; then
            args+=(--autopublish)
          fi
          if [ "$NO_CHANGELOG" = 'true' ]; then
            args+=(--no-changelog)
          fi
          python scripts/release.py release "${args[@]}"
