name: Windows install + update E2E

# PR-time native Windows install/update journey (tests/e2e/core/windows_update):
# the real scripts/install.ps1 on a fresh fake user profile (git redirected to a local
# bare clone, no git/python/uv on PATH), then the real `nastech update` HEAD -> NEXT,
# a running gateway across that update, and a turn against the loopback provider.
# Each file walks one journey (one install) and asserts several user-visible cells;
# tracked bugs are message-gated xfails (tests/e2e/core/_pending_fixes.py).
#
# Called from tests-os.yml when a Python PR touches the install/update code
# (the classifier's e2e_upgrade lane) and on every push to main. Pushes to
# wine2e-install/** run it alone, for sabotage proofs and iteration without the
# rest of CI.

on:
  workflow_call:
    inputs:
      commit:
        description: Commit to test and build. Empty keeps the triggering commit.
        type: string
        default: ''
      strict_acceptance:
        description: >-
          Acceptance runs only: known_failure owners whose gaps FAIL this run instead of xfailing ('upd-txn', a comma list, or '1' for every gap). Sets NASTECH_E2E_STRICT_ACCEPTANCE for the E2E suites (tests/e2e/core/_pending_fixes.py).
        type: string
        required: false
        default: ''
  # An acceptance run of an integrated batch on its own: e.g.
  # `gh workflow run windows-install-update-e2e.yml --ref <branch> -f strict_acceptance=upd-txn`.
  workflow_dispatch:
    inputs:
      strict_acceptance:
        description: >-
          Acceptance runs only: known_failure owners whose gaps FAIL this run instead of xfailing ('upd-txn', a comma list, or '1' for every gap). Sets NASTECH_E2E_STRICT_ACCEPTANCE for the E2E suites (tests/e2e/core/_pending_fixes.py).
        type: string
        required: false
        default: ''
  push:
    branches: ['wine2e-install/**']

permissions:
  contents: read

concurrency:
  group: windows-install-update-e2e-${{ github.event_name }}-${{ inputs.commit != '' && github.run_id || github.ref }}
  # A stable run is on the default branch. It must not queue behind or cancel a push.
  cancel-in-progress: ${{ inputs.commit == '' }}

jobs:
  plan:
    # One job per journey file. Every update and gateway lifetime on a runner takes the
    # harness's machine-wide gateway-phase lock (tests/e2e/core/windows_update/_machine.py), so
    # with all files on one runner the journeys queued for it: ~33 of the job's ~40 minutes
    # were serialized gateway phases, and more cores did not shorten it. One runner per file
    # leaves each journey's lock uncontended. A new test_*.py gets its own job without editing
    # this file.
    name: Plan Windows install + update journeys
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          # The clean-worktree step below loads its action from the checkout.
          sparse-checkout: |
            tests/e2e/core/windows_update
            .github/actions/check-clean-worktree
      - name: List journey files
        id: plan
        run: |
          set -euo pipefail
          shards=$(python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path("tests/e2e/core/windows_update")
          print(json.dumps(sorted(p.relative_to(root).as_posix() for p in root.rglob("test_*.py"))))
          PY
          )
          # A plan that selects nothing is a wiring bug, not a pass.
          [ "$shards" != "[]" ] || { echo "no journey files under tests/e2e/core/windows_update" >&2; exit 1; }
          echo "shards=$shards" | tee -a "$GITHUB_OUTPUT"

      - name: Check the checkout is clean
        # Last step of every job (tests/ci/test_clean_worktree_check.py).
        uses: ./.github/actions/check-clean-worktree

  install-update:
    name: Windows install.ps1 + nastech update E2E (${{ matrix.shard }})
    needs: plan
    # Measured over two dispatches each: the longest job (test_crash_cells.py) took 16.1-17.8 min
    # on 8 vCPU, 16.6-18.2 on 4 vCPU, and 20.4 on 2 vCPU, where its mid-git-bootstrap kill cell
    # also missed its window. One journey per runner needs no more than 4 vCPU.
    runs-on: windows-latest
    # Upstream runs this on a 32-core windows-latest image (~17 min). This
    # repo only has the free 4-core windows-latest, where the per-install Node
    # dependency build is the long pole (one install already exceeded 25 min
    # at 6-way worker contention). The lane needs both a lower worker count
    # and a larger wall-clock budget than upstream's comment assumes.
    timeout-minutes: 150
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          # serve.git is a bare clone of this checkout: the installer's treeless clone and
          # `nastech update` need real history and release tags (version identity), as on GitHub.
          fetch-depth: 0

      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          packages: git,ripgrep
          extras: '["all", "telegram", "anthropic", "mistral", "fal", "modal", "daytona", "parallel-web"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Run Windows install + update E2E
        shell: bash
        run: |
          scripts/run_tests.sh "tests/e2e/core/windows_update/$SHARD" -- \
            -m "platforms and integration" -v --tb=short -rA
        env:
          SHARD: ${{ matrix.shard }}
          NASTECH_E2E_WINDOWS_INSTALL: '1'
          NASTECH_E2E_STRICT_ACCEPTANCE: ${{ inputs.strict_acceptance }}
          # Machine work dirs (serve.git, transcripts) stay short under runner.temp. The fake
          # user profiles live in C:\Users itself, where a real one does: the checkout carries
          # 159-character paths, so a deeper profile hits MAX_PATH where no user would (the
          # runner is disposable, so writing C:\Users is fine).
          NASTECH_E2E_MACHINE_ROOT: ${{ runner.temp }}\wm
          NASTECH_E2E_PROFILES_ROOT: C:\Users
          NASTECH_E2E_ARTIFACTS: ${{ runner.temp }}\win-update-e2e
          # One journey per file, in parallel (each is mostly network +
          # subprocess wait). Upstream runs 6 on a 32-core host; on the free
          # 4-core windows-latest 6 concurrent installs starve each other's
          # npm ci / native build. Match the runner's core count.
          NASTECH_TEST_WORKERS: '4'
          # test_crash_cells.py runs its whole journey (install, gateway phase, six crash cells)
          # inside one module-scoped fixture, so a file timeout leaves zero tests collected and
          # skips the fixture's teardown. ~2,100 s on a normal runner; on the 4-core free runner
          # under 4-way load it exceeded 3,600 s (run 44873305395 attempt 1: SIGKILLed at 3,603 s,
          # which leaked a gateway, the fake profile and serve.git) and 5,401.9 s (rc.13 gate
          # 45193970121, run 137759858097) with the manifest showing all cells ok. The job allows
          # 150 min, so give this file room to finish and tear down cleanly.
          NASTECH_TEST_FILE_TIMEOUT: '7200'
          NASTECH_TEST_FILE_RETRIES: '0'
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NASTECH_API_KEY: ''

      - name: Every crash cell ran
        if: matrix.shard == 'test_crash_cells.py'
        # run_tests.sh passes a file whose tests were all deselected (pytest exit 5) or skipped,
        # so a lost marker or opt-in would run zero crash cells green. The crash journey writes
        # this manifest only when it ran (tests/e2e/core/windows_update/test_crash_cells.py).
        shell: pwsh
        env:
          NASTECH_E2E_ARTIFACTS: ${{ runner.temp }}\win-update-e2e
        run: |
          $manifest = Join-Path $env:NASTECH_E2E_ARTIFACTS 'crash-cells-ran.txt'
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "test_crash_cells.py ran no crash cells: $manifest is missing"
          }
          Get-Content -LiteralPath $manifest

      - name: No machine install left behind
        if: always()
        # Each journey's teardown deletes its fake profile (a full install: checkout, venv with
        # every extra, PM tools, caches) and its serve.git. When every journey shared one runner,
        # their leftovers filled its drive (run 39853224877: 92 MB left); this stays the backstop
        # for a teardown that misses.
        shell: pwsh
        run: |
          $left = @(Get-ChildItem -LiteralPath 'C:\Users' -Directory -Filter '*nastech-e2e-*' -ErrorAction SilentlyContinue)
          $left += @(Get-ChildItem -Path "${{ runner.temp }}\wm\*\serve.git" -Directory -ErrorAction SilentlyContinue)
          if ($left.Count -eq 0) { 'every machine install was removed'; exit 0 }
          foreach ($d in $left) { "::error::left behind by a journey teardown: $($d.FullName)" }
          Get-ChildItem -Path "${{ runner.temp }}\win-update-e2e\*\teardown-leftovers.txt" -ErrorAction SilentlyContinue |
            ForEach-Object { Get-Content -LiteralPath $_.FullName }
          exit 1

      - name: Upload transcripts, logs and receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-install-update-e2e-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/win-update-e2e
          if-no-files-found: ignore
          retention-days: 14

      - name: No leftover Python / Nastech processes
        # Backstop for each journey's teardown: nothing a machine started may outlive it.
        if: always()
        shell: pwsh
        run: |
          $names = 'python.exe', 'pythonw.exe', 'nastech.exe', 'node.exe'
          # Work dirs live under runner.temp\wm; profiles are C:\Users\*nastech-e2e-<id>.
          $root = "${{ runner.temp }}\wm".ToLower()
          $profileMark = 'nastech-e2e-'
          $deadline = (Get-Date).AddSeconds(20)
          do {
            $left = @(Get-CimInstance Win32_Process | Where-Object {
              $blob = "$($_.CommandLine) $($_.ExecutablePath)".ToLower()
              ($names -contains $_.Name.ToLower()) -and ($blob.Contains($root) -or $blob.Contains($profileMark))
            })
            if ($left.Count -eq 0) { 'no leftover processes from the E2E machines'; exit 0 }
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $deadline)
          foreach ($p in $left) {
            "::error::leftover pid=$($p.ProcessId) ppid=$($p.ParentProcessId): $($p.CommandLine)"
          }
          exit 1
