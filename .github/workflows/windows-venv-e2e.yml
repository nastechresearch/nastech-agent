name: Windows venv-holder live E2E

# ON-DEMAND ONLY (fleet-update #91277, venv-holder consolidation work).
#
# Runs the live venv-holder E2E suite on a real windows-latest runner:
# spawns actual processes with realistic Nastech argv shapes and drives the
# REAL detection/classification/exemption code against the live process
# table — the coverage that cannot exist on the Linux lanes and that the
# maintainer cannot exercise locally before the work reaches main.
#
# Deliberately NOT wired to pull_request/main: it fires only on pushes to
# wine2e/** working branches, so it costs nothing on normal PRs. Delete or
# keep dormant after the venv-holder work lands.

on:
  push:
    branches:
      - 'wine2e/**'
  workflow_call:
    inputs:
      commit:
        description: Commit to test and build. Empty keeps the triggering commit.
        type: string
        default: ''
      release:
        description: 'Stable-release candidate run. Unused by the jobs; the caller passes it for a uniform callable surface.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# A workflow_call run (stable release) shares the caller's commit; its group
# includes github.run_id so a rerun of the parent gets a fresh group instead
# of cancelling this child mid-flight. wine2e push runs keep ref-scoped
# collapse as before.
concurrency:
  group: windows-venv-e2e-${{ inputs.release == true && github.run_id || github.ref }}
  cancel-in-progress: ${{ inputs.release != true }}

jobs:
  r6-lock-probe:
    name: R6 checkout-lock probe (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          extras: '["messaging"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Probe matrix on Windows PowerShell 5.1 (the hand-off host)
        shell: powershell
        run: .\scripts\desktop-update\r6-matrix-probe.ps1

      - name: Probe matrix on pwsh 7 (.NET Core)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: .\scripts\desktop-update\r6-matrix-probe.ps1

      - name: Six real runs of the flaky R6 test, with every probe answer logged
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          rm -f "$RUNNER_TEMP/r6-probe.log" scripts/desktop-update/r6-probe.log
          for i in 1 2 3 4 5 6; do
            echo "=== run $i ==="
            if bash scripts/run_tests.sh \
                 tests/scripts/desktop_update/test_desktop_update_windows_commit_outcome.py \
                 -- -k r6_release_wait -v; then
              echo "run $i PASS"
            else
              echo "run $i FAIL"
            fi
          done
          echo '=== every Test-CheckoutLockHeld decision the hand-offs made ==='
          cat scripts/desktop-update/r6-probe.log 2>/dev/null || echo '(no workspace diagnostics)'
          cat "$RUNNER_TEMP/r6-probe.log" 2>/dev/null || echo '(no RUNNER_TEMP diagnostics)'

